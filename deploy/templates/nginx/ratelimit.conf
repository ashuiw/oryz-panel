# Oryz Panel — rate limiting zones (http context).
# Sized for a 10 MB shared zone ≈ 160k tracked client addresses.

limit_req_zone $binary_remote_addr zone=oryz_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=oryz_api:10m     rate=20r/s;
limit_req_zone $binary_remote_addr zone=oryz_auth:10m    rate=1r/s;

limit_conn_zone $binary_remote_addr zone=oryz_conn:10m;

# Respond with 429 rather than the nginx default 503.
limit_req_status 429;
limit_conn_status 429;

# Oryz Panel — nginx site (HTTPS, HTTP/2, WebSockets)
# Generated by the installer. Re-render with: panelctl config set … && panelctl restart

upstream oryz_app {
    server 127.0.0.1:@@APP_PORT@@;
    keepalive 32;
}

upstream oryz_ws {
    server 127.0.0.1:@@WS_PORT@@;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@;

    # ACME HTTP-01 challenges must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @@DOMAIN@@;

    ssl_certificate     @@SSL_CERT@@;
    ssl_certificate_key @@SSL_KEY@@;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:OryzTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    include snippets/oryz-security.conf;

    client_max_body_size 512m;
    client_body_timeout  120s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml font/woff2;

    access_log /var/log/nginx/oryz.access.log;
    error_log  /var/log/nginx/oryz.error.log warn;

    # --- immutable build assets --------------------------------------------
    location /_build/ {
        alias @@APP_DIR@@/.output/public/_build/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location /assets/ {
        alias @@APP_DIR@@/.output/public/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # --- console / live streams --------------------------------------------
    location /ws {
        proxy_pass http://oryz_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- authentication endpoints: strict rate limit ------------------------
    location ~ ^/(api/auth|auth)/ {
        limit_req zone=oryz_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://oryz_app;
        include snippets/oryz-security.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API ----------------------------------------------------------------
    location /api/ {
        limit_req zone=oryz_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://oryz_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- application --------------------------------------------------------
    location / {
        limit_req zone=oryz_general burst=100 nodelay;
        proxy_pass http://oryz_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location ~ /\.(?!well-known) { deny all; }
}

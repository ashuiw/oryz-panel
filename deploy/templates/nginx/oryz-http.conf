# Oryz Panel — plain HTTP site.
# Used before a certificate exists, or when TLS is terminated upstream.

upstream oryz_app_http { server 127.0.0.1:@@APP_PORT@@; keepalive 32; }
upstream oryz_ws_http  { server 127.0.0.1:@@WS_PORT@@;  keepalive 16; }

map $http_upgrade $connection_upgrade_http {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@;

    include snippets/oryz-security.conf;
    client_max_body_size 512m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location /ws {
        proxy_pass http://oryz_ws_http;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_http;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        limit_req zone=oryz_general burst=100 nodelay;
        proxy_pass http://oryz_app_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
